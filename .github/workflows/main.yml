name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: 📱 Generate Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Dependencies
        run: |
          npm install --force || npm install --legacy-peer-deps

      - name: 🏗️ Build Web Application
        run: |
          npm run build

      - name: 📱 Configure Capacitor & Android
        run: |
          npm install -g @capacitor/cli
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: ⚙️ Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: 🚀 Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 📤 Upload APK Artifact (Download APK)
        uses: actions/upload-artifact@v4
        with:
          name: TASS-INPUT-v2.0-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
