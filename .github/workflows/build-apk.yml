name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: 📱 Generate Android APK
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 🤖 Setup Android SDK & Tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 platforms;android-36 build-tools;35.0.0 build-tools;36.0.0 platform-tools'

      - name: 📝 Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | sdkmanager --licenses || true

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install Node Dependencies
        run: |
          npm install --force

      - name: 🏗️ Build Web Application
        run: |
          npm run build

      - name: 📱 Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          # Ensure fallback 36 doesn't override SDK 35 in capacitor-android
          sed -i 's/: 36/: 35/g' node_modules/@capacitor/android/capacitor/build.gradle || true
          sed -i 's/compileSdk = 36/compileSdk = 35/g' node_modules/@capacitor/android/capacitor/build.gradle || true
          sed -i 's/targetSdkVersion 36/targetSdkVersion 35/g' node_modules/@capacitor/android/capacitor/build.gradle || true

      - name: 🚀 Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📤 Upload APK Artifact (Download APK)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: TASS-INPUT-v2.0-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 📋 Upload Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-reports
          path: |
            android/app/build/reports
            android/app/build/outputs/logs

